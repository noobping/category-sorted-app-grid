name: package
needs: check
on:
  - manual
  - pre-push

artifacts:
  paths:
    - dist/*.zip
  mode: keep

steps:
  - name: package zip
    container:
      packages:
        - zip
        - unzip
    run: |
      set -eu

      uuid="$(sed -n 's/.*"uuid"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' metadata.json)"
      test -n "$uuid"

      mkdir -p dist
      zip_file="dist/$uuid.zip"
      rm -f "$zip_file"

      zip -9 -X "$zip_file" -@ < extension-files.txt

      while IFS= read -r file; do
        zipinfo -1 "$zip_file" | grep -Fxq "$file"
      done < extension-files.txt

      printf 'Created %s\n' "$zip_file"
